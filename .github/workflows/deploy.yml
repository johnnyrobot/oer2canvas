name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Same reason as `ci.yml`, and it belongs in BOTH: this job runs the same
      # `npm test`, and `scripts/canvas-image-probes.mjs` validates the generated
      # cartridge XML with a real parser. The runner image does not ship
      # `xmllint`, so without this the deploy fails on a missing tool rather than
      # on anything about the release — which is exactly how it failed, silently
      # and from the first dispatch after the probe test landed.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run verify:production
        env:
          PRODUCTION_ORIGIN: https://oer2canvas.johnnyrobot.dev
      # Runs last because it deliberately triggers the zone WAF's ten-second
      # mitigation window. Its requests have no target and no Authorization
      # header, so none can reach a publisher or Canvas.
      - run: npm run verify:edge-rate-limit
        env:
          PRODUCTION_ORIGIN: https://oer2canvas.johnnyrobot.dev
